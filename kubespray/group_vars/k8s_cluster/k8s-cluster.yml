# inventory/sample/group_vars/k8s_cluster/k8s-cluster.yml 을 아래와 같이 수정한다.
#
# 기존 값 변경 (sed 로 치환)
#   kube_network_plugin:    calico         -> cilium
#   kube_service_addresses: 10.233.0.0/18  -> 10.96.0.0/16
#   kube_pods_subnet:       10.233.64.0/18 -> 10.244.0.0/16
#
# 아래는 파일 끝에 추가한다.

# ─────────────────────────────────────────────
# Kubernetes 버전 고정
# 미지정 시 Kubespray 가 아는 최신 버전이 적용된다.
# v 접두사를 붙이지 않는다.
# ─────────────────────────────────────────────

kube_version: 1.35.4

# ─────────────────────────────────────────────
# kube-proxy 제거
#
# Cilium kube-proxy replacement 사용 시 kube-proxy 를 제거한다.
# 병행하면 iptables/IPVS 규칙과 eBPF 가 같은 Service 를 처리하며 충돌한다.
#
# kubeadm_init_phases_skip 조건문에서 cilium_kube_proxy_replacement 가
# 먼저 평가되므로 현재 구성에서 이 변수는 실제로 도달하지 않는다.
# replacement 를 끄는 경우를 대비한 fallback 으로 남긴다.
# ─────────────────────────────────────────────

kube_proxy_remove: true

# ─────────────────────────────────────────────
# kubelet serving certificate
#
# 기본값(false)에서는 kubelet 이 self-signed 인증서를 사용해
# metrics-server 가 TLS 검증에 실패한다.
# true 로 설정하면 kubelet 이 클러스터 CA 에 CSR 을 요청하고,
# kubelet-csr-approver 가 자동 설치되어 승인을 처리한다.
#
# --kubelet-insecure-tls 없이 metrics-server 를 운영하기 위함이다.
# ─────────────────────────────────────────────

kubelet_rotate_server_certificates: true

# approver 는 기본적으로 노드 DNS 이름 해석을 검증하나,
# 본 환경의 노드명(cp-a 등)은 DNS 에 등록되어 있지 않다.
# DNS 검증을 끄는 대신 호스트명 정규식과 IP 대역으로 제한한다.
kubelet_csr_approver_values:
  providerRegex: "^(cp|worker)-[acd]$"
  providerIpPrefixes:
    - "10.20.0.0/16"
  bypassDnsResolution: true
  maxExpirationSeconds: "86400"
