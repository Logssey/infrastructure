name: 제안 및 설계
description: 새로운 기능, 설계 변경 또는 기술 검토를 제안합니다.
title: "[Proposal] "
labels: []
assignees: []
body:
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 해결하려는 문제와 제안하는 방향을 자유롭게 작성해주세요.
      placeholder: |
        문제:
        제안:
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 기대 효과, 영향 범위, 위험, 대안 또는 관련 링크가 있을 때 작성해주세요.
    validations:
      required: false
