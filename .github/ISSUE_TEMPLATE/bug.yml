name: 버그
description: 예상과 다르게 동작하거나 수정이 필요한 문제를 등록합니다.
title: "[Bug] "
labels: []
assignees: []
body:
  - type: dropdown
    id: impact
    attributes:
      label: 영향도
      description: 현재 확인한 범위에서 선택해주세요.
      options:
        - 낮음 - 우회 가능하거나 영향이 제한적임
        - 보통 - 주요 기능 일부에 영향이 있음
        - 높음 - 서비스, 보안 또는 일정에 큰 영향이 있음
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 문제 내용
      description: 발생한 현상, 기대 결과, 재현 방법을 자유롭게 작성해주세요.
      placeholder: |
        발생한 현상:
        기대한 결과:
        재현 방법:
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 확인 환경, 민감정보를 제거한 로그, 화면 또는 관련 링크가 있을 때 작성해주세요.
    validations:
      required: false
