name: 작업 등록
description: 구현, 인프라, 검증, 문서화 등 일반 작업을 등록합니다.
title: "[Task] "
labels: []
assignees: []
body:
  - type: textarea
    id: details
    attributes:
      label: 작업 내용
      description: 목표, 배경, 필요한 작업을 자유롭게 작성해주세요.
      placeholder: |
        목표:
        내용:
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 완료 여부를 확인할 수 있는 기준을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 사항
      description: 관련 Issue, 의존성, 위험, 링크가 있을 때 작성해주세요.
    validations:
      required: false
