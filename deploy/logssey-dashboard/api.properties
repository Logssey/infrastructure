# Logssey dashboard API (ADR-D010). No secret values in this file.
# /run/secrets holds spring.datasource.password and logssey.admin.password (file name = property name).
spring.datasource.url=jdbc:postgresql://db:5432/logssey
spring.datasource.username=logssey
# The API applies Flyway at startup as the schema owner (not a superuser). See ADR-D010.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

logssey.admin.login-id=admin
logssey.admin.display-name=Security Admin
# Give the bootstrap admin the Secret roles (ADMIN alone gets 403 on Secret screens).
logssey.secret.bootstrap-security-login-id=admin
logssey.secret.bootstrap-operations-login-id=admin

# Browsers treat http://localhost (SSM port forwarding) as secure, so secure cookies still work.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.software.amazon.awssdk=OFF
logging.level.org.apache.hc.client5.http.wire=OFF
logging.level.org.apache.hc.client5.http.headers=OFF

# Secret sources and validators stay off until the Secret owner attaches the worker.
logssey.secret.aws.collection.credentials-mode=WORKLOAD
logssey.secret.github.enabled=false
logssey.secret.aws.content.enabled=false
logssey.secret.validation.aws.enabled=false
logssey.secret.validation.github.enabled=false
logssey.secret.validation.notion.enabled=false
logssey.secret.notion.collection.enabled=false
logssey.secret.notion.token-file=
logssey.secret.guide.claude.enabled=false
logssey.secret.guide.groq.enabled=false
logssey.notion.collector.token=
logssey.secret.operations.deployment-key=secret-worker
logssey.secret.operations.expected-instances=1
logssey.secret.permissions.enabled=false
logssey.secret.usage.cloudtrail-enabled=false

# Reach targets for this installation (PRD FR-15). Change these to install for another service.
# Reach results (CI upload, L1) are connected in a later step; these only fill the Reach screens' app list.
logssey.reach.apps[0].code=API
logssey.reach.apps[0].repo=service-backend
logssey.reach.apps[0].image=logssey/reused-api
logssey.reach.apps[1].code=WEB
logssey.reach.apps[1].repo=service-frontend
logssey.reach.apps[1].image=logssey/reused-web
logssey.reach.apps[2].code=CHAT
logssey.reach.apps[2].repo=service-backend
logssey.reach.apps[2].path=chat-server
logssey.reach.apps[2].image=logssey/reused-chat
logssey.reach.l1.cluster=reused-prod
logssey.reach.l1.namespaces=reused