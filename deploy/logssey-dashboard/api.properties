# Logssey dashboard API (ADR-D010). No secret values in this file.
# /run/secrets holds spring.datasource.password and logssey.admin.password (file name = property name).
spring.datasource.url=jdbc:postgresql://db:5432/logssey
spring.datasource.username=logssey
# The API applies Flyway at startup as the schema owner (not a superuser). See ADR-D010.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

logssey.admin.login-id=admin
logssey.admin.display-name=Security Admin
# Give the bootstrap admin the Secret roles (ADMIN alone gets 403 on Secret screens).
logssey.secret.bootstrap-security-login-id=admin
logssey.secret.bootstrap-operations-login-id=admin

# Browsers treat http://localhost (SSM port forwarding) as secure, so secure cookies still work.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.software.amazon.awssdk=OFF
logging.level.org.apache.hc.client5.http.wire=OFF
logging.level.org.apache.hc.client5.http.headers=OFF

# Source credentials are managed through the dashboard and stored under its Secrets Manager prefix.
logssey.secret.connections.enabled=true
logssey.secret.connections.aws-region=ap-northeast-1
logssey.secret.connections.aws-account-id=794386801311
logssey.secret.connections.secret-prefix=logssey/dashboard/source-credentials/
logssey.secret.aws.collection.credentials-mode=WORKLOAD
logssey.secret.aws.collection.credentials-file=/run/aws/credentials.json
logssey.secret.github.enabled=true
logssey.secret.aws.content.enabled=false
logssey.secret.validation.aws.enabled=false
logssey.secret.validation.github.enabled=false
logssey.secret.validation.notion.enabled=false
# Notion page scanning (worker.properties). The API reads the token only for the connection test.
logssey.secret.notion.collection.enabled=true
logssey.secret.notion.token-file=/run/secrets/notion-token
logssey.secret.guide.provider=claude
logssey.secret.guide.claude.enabled=true
logssey.secret.guide.claude.api-key-secret-id=logssey/dashboard/ai/claude-api-key
logssey.secret.guide.claude.aws-region=ap-northeast-1
logssey.secret.guide.groq.enabled=false
# Security part reports: Claude remediation advice. Reuses the Claude key settings above
# (same Secrets Manager secret, read with the API role session). Off unless set to true.
logssey.report.ai.enabled=true
logssey.notion.collector.token=
logssey.secret.operations.deployment-key=secret-worker
logssey.secret.operations.expected-instances=1
logssey.secret.permissions.enabled=false
logssey.secret.usage.cloudtrail-enabled=false

# Reach targets for this installation (PRD FR-15). Change these to install for another service.
# ecosystem: maven (default) or npm. Shown on the screens; npm apps get no L2 (call graph) verdicts.
# CI uploads, dashboard scan requests and L1 use these apps.
logssey.reach.apps[0].code=API
logssey.reach.apps[0].repo=service-backend
logssey.reach.apps[0].image=logssey/reused-api
logssey.reach.apps[1].code=WEB
logssey.reach.apps[1].repo=service-frontend
logssey.reach.apps[1].image=logssey/reused-web
logssey.reach.apps[1].ecosystem=npm
logssey.reach.apps[2].code=CHAT
logssey.reach.apps[2].repo=service-backend
logssey.reach.apps[2].path=chat-server
logssey.reach.apps[2].image=logssey/reused-chat
logssey.reach.apps[2].ecosystem=npm
logssey.reach.l1.cluster=reused-prod
logssey.reach.l1.namespaces=reused
# Reach L1 collector (CronJob in that cluster, gitops reach/l1/): service account tokens from this issuer.
# Only system:serviceaccount:reach:reach-l1-collector may upload (default subject). Empty issuer = collector tokens rejected.
logssey.reach.l1.collector.issuer=https://k8s-oidc.re-used.store
# Reach CI (GitHub OIDC, API-12/13): accept tokens from repos of this org listed in logssey.reach.apps
logssey.reach.ci.repository-owner=Logssey
# Default branch of the service repos (service-backend, service-frontend). Image checks and dashboard scan requests
# run the workflow file on this branch; the default (main) has no reach.yml there.
logssey.reach.ci.default-branch=develop
# Dashboard scan requests (API-01) dispatch reach.yml through this GitHub App (Actions: read and write, installed on
# service-backend only). The private key is the file /run/secrets/logssey.reach.dispatch.private-key; without it
# requests stay queued.
logssey.reach.dispatch.app-id=5785355
# GitHub sign-in (ADR-D010): Logssey org members only, like Grafana.
# Client ID is not a secret. The client secret is the file
# /run/secrets/spring.security.oauth2.client.registration.github.client-secret
spring.security.oauth2.client.registration.github.client-id=Ov23liFr3Ph5Pu5uymEB
spring.security.oauth2.client.registration.github.scope=read:user,read:org
spring.security.oauth2.client.registration.github.redirect-uri=https://logssey.re-used.store/login/oauth2/code/github
logssey.auth.github.allowed-organization=Logssey
