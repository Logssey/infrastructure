# IaC security worker (dashboard-backend iac-worker, Dockerfile --target iac-worker; IaC security ADR-13).
# Mounted at /run/config/application.properties. The DB password comes from
# secrets/iac-worker/spring.datasource.password (configtree). No secret values in this file.
spring.datasource.url=jdbc:postgresql://db:5432/logssey
# IaC-only DB role with table-level rights (iac-db-role.sh), not the schema owner
spring.datasource.username=logssey_iac
# Migrations are applied by the API only
spring.flyway.enabled=false

logssey.iac.executor.enabled=true
logssey.iac.executor.poll-delay=10s

# Asset graph (Neo4j). Empty until the graph step: without it the graph and analysis jobs stay pending.
logssey.iac.graph.uri=
# AWS: default chain -> AWS_CONFIG_FILE credential_process (compose.yaml). Read only:
# cloudfront:ListDistributions, iam:SimulateCustomPolicy (role logssey-dashboard-role-iac-worker).
logssey.iac.graph.aws-profile=
