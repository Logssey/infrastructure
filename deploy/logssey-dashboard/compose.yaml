# Logssey dashboard on one host (ADR-D010). Run from /opt/logssey as root.
# Images come from .env (API_IMAGE, FRONTEND_IMAGE, WORKER_IMAGE) pinned by digest.
# Internet: ALB -> frontend :8088 -> api. The API signs people in with GitHub (Logssey org only).
# Fallback: SSM port forwarding to localhost:8088 and the password admin.
name: logssey

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    shm_size: 128m
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - /var/lib/logssey/postgres:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./secrets/db:/run/secrets:ro
    healthcheck:
      # TCP 로 본다. 초기화 중 임시 서버는 소켓으로만 듣기 때문에 이 검사를 통과하지 않는다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d logssey"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  api:
    image: ${API_IMAGE:?Set API_IMAGE in .env}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    pids_limit: 128
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - type: bind
        source: ./api.properties
        target: /run/config/application.properties
        read_only: true
      - type: bind
        source: ./secrets/api
        target: /run/secrets
        read_only: true
      - type: bind
        source: ./aws/api
        target: /run/aws
        read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"]
    networks: [backend, frontend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env}
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    # Only the ALB security group (and SSM port forwarding) can reach this port.
    ports: ["8088:8080"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0700"]
    depends_on: [api]
    networks: [frontend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # Secret worker (dashboard-backend secret-worker, Dockerfile --target worker): no web port, talks to the DB
  # and, once enabled in worker.properties, to the approved sources (GitHub, AWS, Notion) over HTTPS.
  # Same commit as the API; deploy.sh worker runs after deploy.sh api.
  secret-worker:
    image: ${WORKER_IMAGE:?Set WORKER_IMAGE in .env}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 1g
    pids_limit: 128
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - type: bind
        source: ./worker.properties
        target: /run/config/application.properties
        read_only: true
      - type: bind
        source: ./secrets/worker
        target: /run/secrets
        read_only: true
      - type: bind
        source: ./aws/worker
        target: /run/aws
        read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"]
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # IaC security worker (dashboard-backend iac-worker, Dockerfile --target iac-worker; IaC security ADR-13).
  # No web port. Talks to the DB as logssey_iac (iac-db-role.sh) and, read only, to AWS.
  # Profile "iac": plain `docker compose up -d` and the other services' commands never start or need it,
  # and the default image keeps the file valid before IAC_WORKER_IMAGE is in .env. deploy.sh iac-worker starts it.
  iac-worker:
    profiles: [iac]
    image: ${IAC_WORKER_IMAGE:-iac-worker-not-configured}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      db: {condition: service_healthy}
    environment:
      AWS_CONFIG_FILE: /run/aws-config/config
    volumes:
      - type: bind
        source: ./iac-worker.properties
        target: /run/config/application.properties
        read_only: true
      - type: bind
        source: ./secrets/iac-worker
        target: /run/secrets
        read_only: true
      - type: bind
        source: ./aws-iac/worker
        target: /run/aws
        read_only: true
      - type: bind
        source: ./iac-worker.aws-config
        target: /run/aws-config/config
        read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700"]
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # IaC security asset graph (Neo4j; IaC security ADR-13). Only iac-worker (and the collector) reach it.
  neo4j:
    profiles: [iac]
    image: neo4j:5.26.30-community@sha256:3388e05ee53c8313d01acdf33e63ad175af95a92226dc8551160564439ce2c8c
    user: "7474:7474"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 1g
    pids_limit: 256
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j-auth
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_http_enabled: "false"
      NEO4J_server_https_enabled: "false"
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - /var/lib/logssey/neo4j:/data
      - ./secrets/neo4j:/run/secrets:ro
    tmpfs:
      - "/tmp:rw,exec,nosuid,size=64m,uid=7474,gid=7474"
      - "/logs:rw,noexec,nosuid,size=64m,uid=7474,gid=7474"
      - "/var/lib/neo4j/run:rw,noexec,nosuid,size=8m,uid=7474,gid=7474"
      - "/var/lib/neo4j/conf:rw,noexec,nosuid,size=8m,uid=7474,gid=7474"
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/7687"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  backend: {}
  frontend: {}
