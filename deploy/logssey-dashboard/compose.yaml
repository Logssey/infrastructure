# Logssey dashboard on one host (ADR-D010). Run from /opt/logssey as root.
# Images come from .env (API_IMAGE, FRONTEND_IMAGE) pinned by digest.
name: logssey

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    shm_size: 128m
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - /var/lib/logssey/postgres:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./secrets/db:/run/secrets:ro
    healthcheck:
      # TCP 로 본다. 초기화 중 임시 서버는 소켓으로만 듣기 때문에 이 검사를 통과하지 않는다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d logssey"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  api:
    image: ${API_IMAGE:?Set API_IMAGE in .env}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    pids_limit: 128
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - type: bind
        source: ./api.properties
        target: /run/config/application.properties
        read_only: true
      - type: bind
        source: ./secrets/api
        target: /run/secrets
        read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700]
    networks: [backend, frontend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env}
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    ports: ["127.0.0.1:8088:8080"]
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0700]
    depends_on: [api]
    networks: [frontend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  backend: {}
  frontend: {}