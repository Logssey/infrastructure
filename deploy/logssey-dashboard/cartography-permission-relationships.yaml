# Cartography permission mapping for the IaC asset graph (IaC security ADR-04, ADR-13).
# Same content as the former in-cluster ConfigMap (gitops iac/graph/cartography-config.yaml).
# Path analysis follows CAN_READ to data assets: S3 objects and Secrets Manager values.
# The image's own default file maps secrets to GET_SECRET, so it cannot replace this file.
- target_label: AWSS3Bucket
  permissions:
  - S3:GetObject
  relationship_name: CAN_READ
- target_label: AWSS3Bucket
  permissions:
  - S3:PutObject
  relationship_name: CAN_WRITE
- target_label: AWSSecretsManagerSecret
  permissions:
  - secretsmanager:GetSecretValue
  relationship_name: CAN_READ
