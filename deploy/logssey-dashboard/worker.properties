# Logssey Secret worker (dashboard-backend secret-worker). No secret values in this file.
# /run/secrets (host secrets/worker) holds spring.datasource.password and, once a source is enabled,
# the files below (file name = property name). Example and meaning: dashboard-backend deploy/worker.properties.example,
# docs/secret-deployment.md.
spring.datasource.url=jdbc:postgresql://db:5432/logssey
# Same account as the API for now (the schema owner, ADR-D010). A dedicated worker role with the grants of
# dashboard-backend deploy/render_secret_worker_grants.py is the Secret owner's follow-up.
spring.datasource.username=logssey
# The API applies migrations; the worker never does.
spring.flyway.enabled=false

# Everything that reads a source or runs a scan starts off. The Secret owner turns features on through a PR.
logssey.secret.scheduler.enabled=false
logssey.secret.scheduler.scan-interval=6h
logssey.secret.executor.enabled=false
logssey.secret.github.enabled=false
logssey.secret.aws.collection.enabled=false
logssey.secret.aws.collection.credentials-mode=WORKLOAD
logssey.secret.aws.collection.profile=
logssey.secret.aws.content.enabled=false
logssey.secret.validation.aws.enabled=false
logssey.secret.validation.github.enabled=false
logssey.secret.validation.notion.enabled=false
# Notion: token file /run/secrets/notion-token (host secrets/worker/notion-token, owner 10001, 0400).
# The API needs the same token file and setting for the connection test.
logssey.secret.notion.collection.enabled=false
logssey.secret.notion.token-file=
logssey.secret.permissions.enabled=false
logssey.secret.usage.cloudtrail-enabled=false
logssey.secret.detection.gitleaks-path=/usr/local/bin/gitleaks
# Content detection (GitHub, AWS content, Notion) also needs the fingerprint key file
# /run/secrets/logssey.secret.detection.fingerprint-key and its version below.

# Heartbeat and maintenance: the API shows the worker in Secret operations health (api.properties expects 1).
logssey.secret.operations.enabled=true
logssey.secret.operations.deployment-key=secret-worker
logssey.secret.operations.expected-instances=1
logssey.secret.operations.snapshot-cleanup.enabled=true

logging.level.software.amazon.awssdk=OFF
logging.level.org.apache.hc.client5.http.wire=OFF
logging.level.org.apache.hc.client5.http.headers=OFF
